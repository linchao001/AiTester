[project]
name = "aitester-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.3",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langchain-openai>=1.6.6",
  "openai>=2",
  "httpx>=0.27",
  # 精确锁版：设计绑定 wheel 内 step/job 名，防 [tool.uv.sources] 丢失后 PyPI 漂移
  "reme-ai==0.4.1.13",
  # reme 0.4.1.13 起 agentscope 在 extra "as"；进程内嵌仍硬装裸包，版本对齐 whl 声明。
  # 不装 reme-ai[core]（faiss/neo4j/polars 等本期不需要）。
  "agentscope==2.0.9",
  # 节点 markdown 的 frontmatter 读写（services/kb/steps.py）；不依赖 reme 链的传递可得性
  "PyYAML>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.entry-points."reme.plugins"]
aitester = "aitester.kb_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitester"]

[tool.uv.sources]
reme-ai = { path = "../lib/reme_ai-0.4.1.13-py3-none-any.whl" }
